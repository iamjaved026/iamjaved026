<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 145" width="100%" height="145">
  <defs>
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d7de" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#1a7f37" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0969da" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d0d7de" stop-opacity="0.2" />
    </linearGradient>

    <style>
      .term-prompt { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 11px; fill: #57606a; }
      .term-cmd    { fill: #218bff; font-weight: 600; }
      .term-green  { fill: #1a7f37; font-weight: 700; }
