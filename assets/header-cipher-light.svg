        2.5%, 3.4% { opacity: 0.85; fill: #1a7f37; }
        4.2%, 94.2% { opacity: 1; fill: #1a7f37; filter: none; }
        94.3%, 100%   { opacity: 0.4; fill: #0969da; }
      }

      @keyframes decrypt_c1 {
